# Single source of truth for the Services page FAQ. Rendered to HTML on
# /services/ and to FAQPage JSON-LD structured data, /llms-full.txt, and
# /business.json so the visible page and the schema an AI agent reads can
# never drift apart.
- q: "Do you work with non-profits and schools?"
  a: "Yes. It is a major part of the practice, and a charter school is our largest ongoing client. We plan around restricted budgets, funding cycles, academic-calendar maintenance windows, and lean IT staffing. We lean on open-source infrastructure to keep recurring license cost off your budget."
- q: "Can you help with E-Rate?"
  a: "Yes, on both sides. On spending, we plan Category One and Category Two purchases against eligible services and per-student budgets. On filing, we handle competitive bidding and the application cycle, plus the technical documentation PIA review asks for."
- q: "Can you get us CIPA compliant?"
  a: "Yes. We implement and enforce CIPA. That covers content filtering that meets the technology protection measure requirement, an internet safety policy matching what the filter actually does, monitoring of minors' online activity, and the documentation behind the certification you sign. It is a prerequisite for keeping E-Rate discounts."
- q: "Do you offer non-profit rates?"
  a: "We scope to the budget that exists. Tell us what you have and what you need to accomplish. We will tell you honestly what is achievable within it, and what is not."
- q: "Do you work with clients outside Colorado?"
  a: "Yes. On-site work is Denver and Northern Colorado. Remote engagements run anywhere in the United States. Cloud, infrastructure-as-code, monitoring, and automation projects are routinely delivered entirely remotely."
- q: "Do you work with companies that have no IT staff?"
  a: "Yes, it is one of our two most common engagement types. We act as the infrastructure team. Everything is handed over documented, so you are never dependent on anyone's memory."
- q: "Will you work alongside our existing IT department?"
  a: "Yes. Many engagements are exactly that. Your team handles daily operations. We deliver a project they lack the bandwidth or specialist depth to take on, then hand it over documented."
- q: "We are trying to get off VMware. Can you help?"
  a: "Yes. VMware to Proxmox migration is an active part of our practice. It covers cluster design, storage, VM migration, and backups."
- q: "Can you help us reduce our cloud bill?"
  a: "Yes. AWS cost optimization covers right-sizing, spend analysis and architecture review, together with the tagging that makes spend attributable in the first place. Where the honest answer is moving workloads somewhere smaller or back on-premises, we will tell you that too."
- q: "What does an engagement cost?"
  a: "It depends on scope. We quote per project after a scoping conversation rather than publishing a rate card. Send us your situation through the contact form and we will tell you what it would take."
- q: "How do we start?"
  a: "Use the [contact form](/contact/). Tell us your current environment, the problem you are solving, and your timeline."
