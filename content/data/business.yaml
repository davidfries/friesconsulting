audiences:
  - id: "schools"
    label: "Charter schools and K-12 schools"
    schemaType: "Charter schools"
    detail: >
      A charter school is our largest ongoing client. We plan around restricted budgets, E-Rate and CIPA
      deadlines, academic-calendar maintenance windows, 1:1 device fleets, and student data obligations.
  - id: "non-profits"
    label: "Non-profit organizations"
    schemaType: "Non-profit organizations"
    detail: >
      Fixed annual budgets, board-approved capital projects instead of compounding SaaS/hypervisor renewals,
      and documentation built so lean staff are never stuck depending on institutional memory.
  - id: "small-business"
    label: "Small businesses"
    schemaType: "Small businesses"
    detail: >
      Organizations up to roughly 50 staff across professional services, trades, and light industry that need
      reliable infrastructure without hiring a full internal operations team.
engagementShapes:
  - title: "No dedicated IT staff"
    description: >
      We act as your infrastructure team, making architecture decisions, building systems, documenting everything,
      and staying available afterward.
  - title: "Alongside your internal IT department"
    description: >
      Your team handles daily operations while we deliver a specialized project — a Proxmox migration, a
      monitoring build, a network audit — and hand it over documented so your staff owns it.
engagementSteps:
  - step: "01"
    title: "Scoping conversation"
    description: >
      We establish what the problem actually is, what the deliverable ought to be, what constraints exist around
      budget or calendar, and whether we are the right fit — before any work is committed.
  - step: "02"
    title: "Fixed-scope build and documentation"
    description: >
      We design, build, test, and document the system around your operational windows. Everything we build is
      handed over documented so you are never dependent on anyone's memory.
  - step: "03"
    title: "Clean handoff or ongoing advisory"
    description: >
      Your team owns what we built from day one. Ongoing advisory and monitoring support is available once we
      have completed a first project together and know your environment properly.
nonProfitRealities:
  - title: "Budgets are fixed in advance, and often restricted"
    detail: >
      Money approved for one purpose frequently cannot be moved to another, and a recurring subscription is a
      considerably harder approval than a one-time purchase. We scope to that reality and are direct about total
      cost of ownership before you commit rather than after.
  - title: "License costs compound against a budget that does not grow"
    detail: >
      Proxmox, Ceph, Grafana, and Prometheus carry no per-VM, per-socket, or per-seat licensing anywhere in the
      stack. Our private cloud write-up prices a real three-node cluster at roughly $4,950 against what equivalent
      compute costs annually in the cloud, turning a recurring line item into a one-time capital purchase.
  - title: "The calendar is not negotiable"
    detail: >
      Schools have genuine maintenance windows — summer, breaks, after hours — and everything outside them is
      production with students in the building. We plan cutovers around the academic calendar rather than asking
      you to accept downtime during instruction.
  - title: "The IT department is often one person"
    detail: >
      Documentation is not something we tack on at the end; it is most of the point. Everything we build is
      handed over documented, so that neither your staff nor whoever eventually replaces them is dependent on
      our memory.
  - title: "Student and donor data carries obligations"
    detail: >
      Student records, donor information, and payment data each come with their own handling requirements, and we
      build segmentation, access control, backup, and retention with those in mind. Where something falls outside
      our lane and needs counsel or a specialist, we say so plainly.
  - title: "Funding compliance is infrastructure work"
    detail: >
      For schools, E-Rate and CIPA are not paperwork happening somewhere adjacent to the network. The filtering,
      the documentation, and the equipment bought with Category Two money are the same systems we are already
      building and auditing.
  - title: "You have to be able to show your work"
    detail: >
      Boards, auditors, and funders all ask for evidence, and the documentation and monitoring we build produce
      that record as a matter of course, so answering never turns into a scramble.
contactChecklist:
  - title: "Your environment"
    description: >
      Roughly how many users and sites, and what you run today, whether that is on-premises hardware, AWS, or some
      combination of the two. Anything unusual is worth mentioning.
  - title: "The problem"
    description: >
      Whatever is broken, too expensive, or undocumented, or alternatively what you are trying to build.
  - title: "Timeline and any hard dates"
    description: >
      A lease expiring, a license renewal, an audit, a move, or an academic-calendar maintenance window.
  - title: "Who else is involved"
    description: >
      Whether you have internal IT staff, and who makes the decision.
  - title: "Budget, if you have one"
    description: >
      Non-profits and schools especially. Tell us the figure that has already been approved, or the funding cycle
      you are working toward, since we would much rather scope to what exists than quote something you cannot act on.
