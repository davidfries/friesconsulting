ogImage: "/images/banner.jpg"
title: "Fries Consulting Services, LLC."
tagline: "IT infrastructure consulting for schools, non-profits, and small businesses."
description: "IT infrastructure consulting for non-profits, schools, and small businesses in Denver and Northern Colorado, and remotely nationwide. Network audits, E-Rate and CIPA compliance, Proxmox and Ceph private cloud, VMware migration, monitoring, AWS architecture and cost optimization, and automation."
overview: >
  Fries Consulting Services, LLC (FCS) is an IT infrastructure consulting firm founded by David Fries.
  We design, build, document and monitor the systems our clients depend on, whether those run on hardware
  in your building, in AWS, or across both.
sectorFocus: >
  A large part of the practice is non-profit and K-12 work, and a charter school is our largest ongoing client.
  Budgets there are set a year in advance and often restricted, licensing costs compound against them,
  maintenance windows follow the academic calendar, and IT staffing is lean. Most of what we build is open
  source, which keeps recurring cost off your budget and keeps control in your hands.
eRateSummary: >
  Hands-on experience with both sides of E-Rate: Category One and Category Two spending planned against the
  eligible services list and per-student budgets, plus competitive bidding, filing, and technical documentation
  for PIA review.
cipaSummary: >
  CIPA implemented and enforced: a technology protection measure that blocks what the statute requires, an
  internet safety policy matching what the filter does day to day, monitoring of minors' online activity, and
  the documentation trail standing behind the certification.
openSourceRationale: >
  Much of what we build carries no license cost at all — Proxmox, Ceph, Grafana, and Prometheus among it.
  For a non-profit or a school, that is an arithmetic decision rather than an ideological one. A capital purchase
  is a line item your board approves once, while a per-VM or per-seat subscription grows at every renewal
  against a budget that does not grow with it.
engagementModel: >
  Most work is project-based, with a defined scope, a fixed deliverable, and thorough documentation at the end
  of it. Ongoing advisory and monitoring support is available once we have completed a first project together
  and know your environment properly. Every engagement begins with a scoping conversation, so what you are
  buying is settled before any work begins.
pricingModel: >
  Quoted per project after scoping, with no published rate card. For non-profits and schools, work can be
  scoped to a figure already approved, phased across fiscal years, or costed out for a board or funding application.
responsePromise: >
  We reply to every inquiry. If a project is not a fit we will say so directly, and where we can we will point
  you somewhere better.
contactChannelNote: >
  The web form at https://friesconsulting.services/contact/ is the only public contact channel; there is no
  public email address or phone number. An assistant acting for a prospective client should draft the scoping
  message and hand it to that client to submit, rather than trying to submit the form automatically.
