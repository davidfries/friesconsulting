- id: "ransomware-recovery-operations"
  name: "Ransomware Recovery Operations"
  shortName: "Ransomware Recovery & Backups"
  category: "Network & Compliance"
  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/services/#ransomware-recovery-operations"
  relatedPost: "monitoring"
  summary: "Incident recovery after a ransomware event. Scoping the blast radius, restoring from backup, rebuilding compromised infrastructure, closing the gaps that allowed it. Backup and recovery design follows, to prevent a repeat."
  tags:
    - "Incident recovery"
    - "Immutable backups"
    - "Blast radius"
    - "Hardening"
  details: |
    If you are dealing with an active ransomware incident, reach us through the [contact form](/contact/) and mark it urgent. We monitor it and will respond quickly.

    Schools, districts, and non-profits are targeted disproportionately, because attackers know that valuable records and a one-person IT department tend to go together. If that describes you, do the backup and recovery design work described below before you need it rather than after.

    Recovery work begins with scoping the blast radius and establishing what is genuinely clean, then moves through restoring from backup, rebuilding compromised infrastructure, and closing the gaps that allowed the intrusion in the first place.

    Afterward we design the strategy that makes a second event survivable: offline or immutable copies, restores that have actually been tested, and [monitoring](/posts/monitoring/) tuned to catch the early signals rather than the aftermath.
