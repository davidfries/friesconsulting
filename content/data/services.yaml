- id: "infrastructure-monitoring-and-alerting"
  name: "Infrastructure Monitoring and Alerting"
  shortName: "Monitoring & Alerting"
  category: "Observability & Operations"
  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/posts/monitoring/"
  relatedPost: "monitoring"
  summary: "Monitoring and alerting built on Grafana, InfluxDB, Prometheus, and Telegraf. Percentage-based thresholds and maintenance-window suppression mean alerts fire only when action is required."
  tags:
    - "Grafana"
    - "Prometheus"
    - "InfluxDB"
    - "Telegraf"
  details: |
    We build monitoring on Grafana, InfluxDB, Prometheus, and Telegraf, designed around a single principle we call alerting with purpose: an alert should fire only when somebody actually needs to act on it.

    In practice that means percentage-based thresholds rather than absolute ones, suppression during backups and patch windows, and metrics chosen because they predict problems rather than because they happened to be easy to graph.

    Monitoring is also a record. When your ISP's support desk asks for evidence, historical latency and throughput data is the difference between a ticket and an argument. See our [monitoring write-up](/posts/monitoring/).

- id: "aws-architecture-and-cost-optimization"
  name: "AWS Architecture and Cost Optimization"
