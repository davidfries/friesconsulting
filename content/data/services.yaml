  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/posts/awsiac/"
  relatedPost: "awsiac"
  summary: "Architecture review, right-sizing, spend analysis and security configuration review for AWS environments, with tagging and attribution put in place so that spend can be traced to something. Includes an honest assessment of whether a hyperscaler is needed at all."
  tags:
    - "AWS"
    - "Cost optimization"
    - "Tagging"
    - "DigitalOcean"
  details: |
    We work in AWS, and we will tell you plainly when AWS is more than you need. The work covers architecture review, right-sizing, spend analysis, and security configuration review — the questions that matter once an account has grown organically for a few years and nobody is quite sure what is running or why.

    Cost is usually where this starts. Untagged resources cannot be attributed to anything, unattributed spend never gets cleaned up, and the bill grows for reasons nobody can reconstruct. For a fuller treatment see [Streamlining Your AWS Account](/posts/awsiac/), and for the question of whether you need a hyperscaler at all, [Do you really need a hyperscaler?](/posts/small-clouds/).

