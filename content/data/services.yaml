- id: "local-ai-and-log-analysis"
  name: "Local AI and Log Analysis"
  shortName: "Local AI & Filter Log Analysis"
  category: "Automation & Local AI"
  audiences:
    - "schools"
    - "non-profits"
    - "small-business"
  primaryUrl: "/posts/local-llm/"
  relatedPost: "local-llm"
  summary: "Self-hosted large language models running on Ollama with a single NVIDIA GPU, on hardware the client owns, so that sensitive data is never sent to a third party. The primary application is content filter log analysis for schools: categorizing filter traffic to separate miscategorizations from bypass attempts, policy concerns and welfare signals, evidencing the CIPA monitoring requirement, and feeding a role-based Grafana dashboard for staff."
  tags:
    - "Ollama"
    - "NVIDIA GPU"
    - "Student data privacy"
    - "CIPA monitoring"
  details: |
    We deploy self-hosted language models running on Ollama with a single consumer NVIDIA GPU, on hardware you own, so sensitive data never leaves your building. There is no per-token API bill and no third-party vendor data-handling agreement to defend.

    The primary production application is content filter log analysis for schools running 1:1 device programs. A rule engine and cache resolve ~99% of URLs before the model ever runs, leaving only genuinely novel URLs for local LLM classification. That keeps a single 16 GB consumer RTX card well ahead of roughly 250,000 weekly events across ~500 students.

    Output feeds two role-based Grafana views: an engineering health dashboard, and an aggregate staff dashboard in plain language that separates filter miscategorizations from proxy/VPN bypass attempts, policy-relevant patterns, and welfare signals routed to a designated counselor or administrator. See our [local LLM filter log write-up](/posts/local-llm/) for production charts, throughput figures, and design boundaries.

