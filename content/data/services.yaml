- id: "network-audit-and-documentation"
  name: "Network Audit, Documentation and Security Review"
  shortName: "Network Audits & Documentation"
  category: "Network & Compliance"
  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/posts/network-audit/"
  relatedPost: "network-audit"
  summary: "Full internal network audit covering every device, how it connects, VLAN assignment, access, and configuration drift. The client keeps the documentation. Automated change reporting is included, as is network security auditing and Ubiquiti UniFi configuration."
  tags:
    - "Network audit"
    - "VLANs"
    - "UniFi"
    - "Change reporting"
  details: |
    A network audit produces a complete picture of your network: every device on it, how those devices connect, which VLANs they sit on, what access each one has, and where switch and firewall configuration has quietly drifted from intent. The documentation that comes out of it is yours to keep. Automated reporting comes with it too, so that new devices surface as they appear rather than accumulating unnoticed.

    This is the right starting point when nobody can confidently answer "what is on our network," when documentation was never written in the first place, or when a recurring problem has resisted every attempt at diagnosis.

    Schools get more out of it still, ending up with a defensible picture of the 1:1 device fleet, of how student and guest traffic is separated, of what slips past the content filter, and of where the [E-Rate Category Two](#e-rate-funding-and-cipa-compliance) equipment actually ended up.

    Our [network audit write-up](/posts/network-audit/) describes one such engagement in detail, including how the documentation we gathered went on to solve an unrelated VLAN and multicast failure days later.

- id: "e-rate-funding-and-cipa-compliance"
  name: "E-Rate Funding Support and CIPA Compliance"
  shortName: "E-Rate & CIPA Compliance"
  category: "Network & Compliance"
  audiences:
    - "schools"
    - "non-profits"
  primaryUrl: "/services/#e-rate-funding-and-cipa-compliance"
  relatedPost: "local-llm"
  summary: "E-Rate support for schools and libraries. Spending: Category One and Category Two planning against the eligible services list and per-student budgets. Filing: competitive bidding, the application cycle, technical documentation for PIA review. CIPA compliance is covered too, from content filtering that meets the technology protection measure requirement to the internet safety policy, monitoring, and certification that keep funding intact."
  tags:
    - "E-Rate Cat 1 & 2"
    - "PIA review"
    - "CIPA"
    - "Content filtering"
  details: |
    We have worked both sides of E-Rate: planning what to spend it on, and filing to get it in the first place.

    **Spending.** Category Two covers internal connections — switching, wireless access points, cabling, and the rest of the equipment that moves traffic inside your buildings — against a per-student budget spread over a five-year cycle. Getting real value out of that means reading the eligible services list before you design the network rather than after, and sequencing purchases so that none of the budget is left stranded at the end.

    Category One covers the broadband circuit itself, where the questions are contract term, bandwidth sizing, and whether what you are being sold actually matches what you need.

    **Filing.** The application cycle is procedural and unforgiving from competitive bidding through to certification, and the deadlines do not move for anyone. We produce the technical documentation the process demands: service descriptions precise enough to bid against, equipment lists mapped to eligible categories, and the supporting detail PIA review asks for.

    **CIPA compliance.** E-Rate discounts are conditional on CIPA, and we have both implemented it and enforced it. In practice that means a technology protection measure that blocks what the statute actually requires, an internet safety policy that matches what the filter does day to day, monitoring of minors' online activity, and a documentation trail standing behind the certification you sign.

    One failure mode turns up more than any other: a filter configured years ago, never reviewed since, and no longer matching either the written policy or the current threat picture. That is a funding risk as much as a safety one.

    This work pairs naturally with a [network audit](#network-audit-and-documentation), since the device and topology documentation an audit produces is most of what a Category Two request needs anyway. For monitoring evidence at 1:1 scale, see our [local LLM filter log pipeline write-up](/posts/local-llm/).

- id: "private-cloud-design-and-build"
  name: "Private Cloud Design and Build"
  shortName: "Private Cloud (Proxmox & Ceph)"
  category: "Virtualization & Cloud"
  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/posts/privatecloud/"
  relatedPost: "privatecloud"
  summary: "Proxmox VE clusters with Ceph distributed storage, sized to the client's workloads. Provides clustering, live migration, VM high availability, and storage that survives a node failure, all on hardware the client owns."
  tags:
    - "Proxmox VE"
    - "Ceph"
    - "High availability"
    - "CapEx vs OpEx"
  details: |
    We design and build private clouds on Proxmox VE backed by Ceph distributed storage, which gets you clustering, live migration, VM-level high availability, and storage that survives the loss of a node — all of it running on hardware you own, with no per-VM hourly billing attached.

    We size the cluster against the workloads you actually run, specify the hardware and networking, build it, and hand the whole thing over documented.

    For non-profits and schools this is frequently the highest-leverage project on the table, because it converts a licensing and hosting bill that grows every year into a capital purchase made once. Our [private cloud write-up](/posts/privatecloud/) works through a real three-node example with itemized costs (~$4,950 hardware), set against what the equivalent compute (~$5,600/year) would cost in AWS, or run your own numbers in the [Private Cloud TCO Estimator](/calculator/).

- id: "vmware-to-proxmox-migration"
  name: "VMware to Proxmox Migration"
  shortName: "VMware to Proxmox Migration"
  category: "Virtualization & Cloud"
  audiences:
    - "non-profits"
    - "schools"
    - "small-business"
  primaryUrl: "/posts/proxmox/"
  relatedPost: "proxmox"
  summary: "Migration off Broadcom-era VMware licensing to Proxmox VE. Covers cluster design, VM migration, backend storage, and backup strategy using Proxmox Backup Server or Veeam."
  tags:
    - "Proxmox VE"
    - "VMware exit"
    - "Proxmox Backup Server"
    - "Veeam"
  details: |
    Broadcom's acquisition of VMware repriced virtualization out of reach for a great many smaller organizations. Proxmox VE is a credible destination: KVM-based, open source, immediately recognizable to anyone who has run vSphere, and far less restrictive about what hardware it will tolerate.

    We handle cluster design, VM migration, backend storage, and backup strategy using Proxmox Backup Server or Veeam. Our [Proxmox write-up](/posts/proxmox/) sets out our position on the migration generally, and on the backup question in particular.

